<!doctype html><html><head><meta charset="utf-8"><title>Mikee mobile QA</title><style>body{font:14px system-ui;background:#eceeea;margin:15px}header{position:sticky;top:0;background:white;padding:10px;z-index:1}button{padding:10px;margin:3px}#frames{display:flex;gap:20px;align-items:start}iframe{border:1px solid #bbb;height:1500px;background:white}h2{font-size:16px}</style></head><body><header><strong>Mikee Gadget — mobile layout review</strong><button data-route="/iphone-18-pro-max/">Product</button><button data-route="/#categories">Categories</button><button data-route="/shop/wifi-only/">WiFi Only</button></header><div id="frames"></div><script>const widths=[320,360,390,430];document.getElementById('frames').innerHTML=widths.map(w=>`<section><h2>${w}px</h2><iframe title="${w}px mobile preview" width="${w}" src="/iphone-18-pro-max/"></iframe></section>`).join('');document.querySelectorAll('button').forEach(b=>b.onclick=()=>document.querySelectorAll('iframe').forEach(f=>f.src=b.dataset.route));</script></body></html>
