<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mikee responsive review</title><style>body{font:15px Arial;background:#292929;color:white;margin:0;padding:16px}label{display:inline-block;margin:0 15px 14px 0}select,button{padding:10px;font:inherit}iframe{display:block;border:0;height:850px;background:#0d100f}#stage{overflow:auto}pre{white-space:pre-wrap;font-size:13px}a{color:#e1bd70}</style><h1>Mikee storefront review</h1><label>Viewport width <select id="width"><option>320</option><option>360</option><option>375</option><option selected>390</option><option>412</option><option>430</option><option>768</option><option>1440</option></select></label><label>Page <select id="page"><option value="/">Home</option><option value="/iphone-14-pro-max">iPhone 14 Pro Max</option><option value="/iphone-13-pro-max">Unpriced phone</option><option value="/easybuy/">EasyBuy</option><option value="/swap/">Swap</option><option value="/deals/">Deals</option><option value="/samsung-phones">Samsung</option><option value="/shop/laptops/">Laptops</option></select></label><button id="check">Check all widths</button> <button id="image-error">Test missing image</button><p id="report" role="status"></p><div id="stage"><iframe id="preview" title="Website preview" src="/" style="width:390px"></iframe></div><pre id="results"></pre><script>
const frame=document.getElementById('preview'),width=document.getElementById('width'),page=document.getElementById('page'),report=document.getElementById('report');
function metrics(){const d=frame.contentDocument;return {route:frame.contentWindow.location.pathname,width:frame.clientWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>frame.clientWidth,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth&&i.getAttribute('src')).map(i=>i.getAttribute('src')),h1:d.querySelector('h1')?.textContent,nav:!!d.querySelector('.mobile-bottom-nav')};}
function measure(){report.textContent=JSON.stringify(metrics());}
frame.addEventListener('load',()=>setTimeout(measure,600));width.onchange=()=>{frame.style.width=width.value+'px';setTimeout(measure,100);};page.onchange=()=>frame.src=page.value;
document.getElementById('image-error').onclick=()=>{const i=frame.contentDocument.querySelector('.device-media img');if(i){i.removeAttribute('srcset');i.src='/images/review-missing-image.webp';}};
document.getElementById('check').onclick=async()=>{const results=[];for(const w of [320,360,375,390,412,430,768,1440]){frame.style.width=w+'px';await new Promise(r=>setTimeout(r,120));results.push(metrics());}document.getElementById('results').textContent=JSON.stringify(results,null,2);frame.style.width=width.value+'px';measure();};
</script></html>
