<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Check your payment | Mikee Gadget Plug</title><style>body{background:#f7f8f5;color:#123b30;font:16px system-ui;margin:0;padding:8vh 20px}main{max-width:560px;margin:auto;background:white;padding:32px;border-radius:18px;box-shadow:0 8px 35px #123b3015}a{color:#123b30}</style></head><body><main><h1>Checking your payment</h1><p id="status" role="status">We are securely verifying your payment with the payment provider.</p><p><a href="/buy/">Back to shopping</a></p></main><script type="module">const ref=new URLSearchParams(location.search).get('reference');const status=document.querySelector('#status');if(!/^MGP-[a-f0-9]{32}$/.test(ref||'')){status.textContent='Invalid order reference.';}else{fetch('/api/checkout/status?reference='+encodeURIComponent(ref),{cache:'no-store'}).then(r=>r.json()).then(data=>{status.textContent=data.status==='paid'?'Payment confirmed! Your order has been placed. Reference: '+ref:data.status==='manual_review'?'Your payment needs a manual review. Contact us with reference '+ref:data.status==='awaiting_payment'?'Payment is not confirmed yet. If you have paid, please check again shortly. Reference: '+ref:'Order status: '+(data.status||data.error||'unavailable')}).catch(()=>{status.textContent='Status cannot be checked right now. Contact us with reference '+ref;});}</script></body></html>
